<div id="root"><div class="flex flex-col gap-6"><header class="inline-hidden flex items-start justify-between gap-4"><div class="flex flex-col gap-1"><h1 class="text-[20px] font-semibold text-text-primary">M3.2 — Punch Ingestion &amp; Raw Attendance Records</h1><p class="text-[14px] text-text-secondary">Design walkthrough: business workflow first, technical detail second. Planning only — nothing implemented or merged.</p></div><button type="button" tabindex="0" aria-label="Switch to dark mode" id="base-ui-_r_2_" data-base-ui-tooltip-trigger="" data-tooltip-trigger="" class="inline-flex touch-manipulation select-none items-center justify-center outline-none [-webkit-touch-callout:none] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 shrink-0 focus-ring bg-transparent text-text-secondary hover:bg-tint-secondary hover:text-text-primary data-[pressed]:bg-tint-secondary data-[pressed]:text-text-primary rounded-[6px] size-7 [&amp;_svg]:size-[18px]"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></button></header><div class="border-border-secondary bg-bg-elevated light:bg-clip-padding relative w-full overflow-clip rounded-[6px] border mb-6"><div class="absolute left-0 top-0 h-full w-[5px]"></div><div class="flex gap-3 px-4 py-3 items-center flex-wrap"><div class="flex flex-1 flex-col gap-1.5 min-w-[min(100%,16rem)]"><p class="text-13 text-text-secondary"><span class="text-13 font-regular">In one sentence: M3.2 captures and safely stores every punch from every source — nothing is calculated yet. The M3.1 configuration already decides <em>what should happen</em>; M3.2 only records <em>what actually happened</em>, immutably, so the future engine (M3.3) can compare the two.</span></p></div></div></div><div class="mt-10"><div class="text-lg font-semibold text-primary mb-3">1. Proposed architecture</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">Three zones. Left: everything M3.1 already owns — the org tree, versioned masters, assignments and the config resolver; M3.2 only <em>reads</em> these. Middle: the new ingestion layer — devices, badge-code mapping, four punch sources funneling into one ingest service and the append-only punch store. Right: the future engine that will join raw punches to effective configuration.</p><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><svg viewBox="0 0 1378.4 576" role="img" aria-label="Diagram: org to resolver, masters to resolver, assign to resolver, devices to map, push to ingest, devices to ingest, map to ingest, ingest to punches, punches to engine, resolver to engine" style="width: 100%; display: block;"><defs><marker id="ds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="rgb(var(--text-secondary))"></path></marker></defs><g><g><rect x="550.4000000000001" y="226" width="812.0000000000001" height="180" rx="10" fill="rgb(var(--tint-secondary))" stroke="rgb(var(--border-secondary))" stroke-dasharray="3 3"></rect><text x="552.4000000000001" y="219" font-size="11" fill="rgb(var(--text-secondary))">M3.1 — exists today (read-only for M3.2)</text></g><g><rect x="16" y="28" width="514.4" height="378" rx="10" fill="rgb(var(--tint-secondary))" stroke="rgb(var(--border-secondary))" stroke-dasharray="3 3"></rect><text x="18" y="21" font-size="11" fill="rgb(var(--text-secondary))">M3.2 — new (this plan)</text></g><g><rect x="194.4000000000001" y="458" width="837" height="90" rx="10" fill="rgb(var(--tint-secondary))" stroke="rgb(var(--border-secondary))" stroke-dasharray="3 3"></rect><text x="196.4000000000001" y="451" font-size="11" fill="rgb(var(--text-secondary)) 00000001,489.6476462196862" fill="none" stroke="rgb(var(--text-secondary))" stroke-width="1.25" marker-end="url(#ds-arrow)"></path><rect x="221.20000000000005" y="424" width="110.4" height="16" rx="3" fill="rgb(var(--bg-elevated))"></rect><text x="276.40000000000003" y="436" text-anchor="middle" font-size="11" fill="rgb(var(--text-secondary))">reads raw events</text></g><g opacity="1"><path d="M959.4000000000001,388Q959.4000000000001,406 959.4000000000001,419Q959.4000000000001,432 959.4000000000001,445Q959.4000000000001,458 730.9000000000001,488.9248120300752" fill="none" stroke="rgb(var(--text-secondary))" stroke-width="1.25" marker-end="url(#ds-arrow)"></path><rect x="904.2" y="424" width="110.4" height="16" rx="3" fill="rgb(var(--bg-elevated))"></rect><text x="959.4000000000001" y="436" text-anchor="middle" font-size="11" fill="rgb(var(--text-secondary))">effective config</text></g><g><rect x="570.4" y="244" width="232" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="584.4" y="267" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">Organization</text><text x="584.4" y="285" font-size="11" fill="rgb(var(--text-secondary))">Company → Branch → Dept → Employee</text></g><g><rect x="822.4000000000001" y="244" width="274" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="836.4000000000001" y="267" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">Attendance Masters</text><text x="836.4000000000001" y="285" font-size="11" fill="rgb(var(--text-secondary))">Shifts · Policies · Calendars (versioned)</text></g><g><rect x="1116.4" y="244" width="226" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="1130.4" y="267" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">Assignments &amp; Rosters</text><text x="1130.4" y="285" font-size="11" fill="rgb(var(--text-secondary))">shift/policy binding per employee</text></g><g><rect x="843.4000000000001" y="334" width="232" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="857.4000000000001" y="357" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">AttendanceConfigResolver</text><text x="857.4000000000001" y="375" font-size="11" fill="rgb(var(--text-secondary))">effective config per employee+date</text></g><g><rect x="195.90000000000003" y="46" width="268" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="209.90000000000003" y="69" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">att.devices</text><text x="209.90000000000003" y="87" font-size="11" fill="rgb(var(--text-secondary))">biometric terminals, tokens, branch link</text></g><g><rect x="296.40000000000003" y="136" width="196" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="310.40000000000003" y="159" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">att.device_user_map</text><text x="310.40000000000003" y="177" font-size="11" fill="rgb(var(--text-secondary))">device badge code → employee</text></g><g><rect x="36.000000000000014" y="136" width="220.4" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="50.000000000000014" y="159" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">Push / Self / Manual / CSV</text><text x="50.000000000000014" y="177" font-size="11" fill="rgb(var(--text-secondary))">4 punch sources</text></g><g><rect x="193.40000000000003" y="244" width="166" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="207.40000000000003" y="267" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">PunchIngestService</text><text x="207.40000000000003" y="285" font-size="11" fill="rgb(var(--text-secondary))">dedup, mapping, batches</text></g><g><rect x="169.90000000000003" y="334" width="213" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="183.90000000000003" y="357" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">att.punches (append-only)</text><text x="183.90000000000003" y="375" font-size="11" fill="rgb(var(--text-secondary))">+ punch_voids + ingest_batches</text></g><g><rect x="522.9000000000001" y="476" width="208" height="54" rx="8" fill="rgb(var(--bg-page))" stroke="rgb(var(--border-primary))" stroke-width="1"></rect><text x="536.9000000000001" y="499" font-size="13" font-weight="600" fill="rgb(var(--text-primary))">Processing Engine</text><text x="536.9000000000001" y="517" font-size="11" fill="rgb(var(--text-secondary))">M3.3 — days, late, OT, payable</text></g></g></svg></div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">Why this shape: configuration is versioned and already resolves "who works which shift on which date." Raw punches are deliberately dumb events — no shift, no day, no verdict — so ingestion never blocks on configuration and can never corrupt it.</p></div><div class="mt-10"><div class="text-lg font-semibold text-primary mb-3">2. Real-world workflow — two branches, two shifts</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">Acme India has <b>Mumbai HQ</b> and <b>Pune</b>. Mumbai runs General 09:00–18:00, Pune runs Night 20:00–05:00. Priya (EMP-001, Mumbai) works General; Arjun (EMP-002, Pune) works Night. Devices: BIO-MUM-01 at Mumbai, BIO-PUN-01 at Pune.</p><div class="text-sm font-semibold text-primary mt-5 mb-2">Step 1 — Shift assignment (already done in M3.1)</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">HR publishes Shift GEN v1 (09:00–18:00) and NGT v1 (20:00–05:00+1d), then creates shift assignments: Priya → GEN via employee assignment, Arjun → NGT via Pune department default. The resolver can now answer "Priya on 2026-11-20: GEN 09:00–18:00." M3.2 does not use this answer — it is ready for M3.3.</p><div class="text-sm font-semibold text-primary mt-5 mb-2">Step 2 — Device identifies the employee</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">Priya's fingerprint is enrolled on BIO-MUM-01 as badge <b>"102"</b>. HR records this once in the mapping screen: device BIO-MUM-01, badge 102 → employee EMP-001, effective 2026-11-01 onward. The device itself never knows employee IDs — mapping is HRMS-side, so a badge re-issue is a new mapping row, not a data fix.</p><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div data-slot="table-chrome" class="bg-bg-elevated border-border-secondary light:bg-clip-padding @container relative w-full rounded-[12px] border p-1.5 overflow-hidden"><div role="presentation" data-slot="table-container" class="relative overflow-hidden" style="position: relative; --scroll-area-corner-height: 0px; --scroll-area-corner-width: 0px;"><div data-id="base-ui-_r_3_-viewport" tabindex="-1" class="focus-visible:outline-bg-accent-primary size-full rounded-[inherit] outline-none focus-visible:outline focus-visible:outline-2 motion-safe:transition-[color,box-shadow] overscroll-x-contain before:pointer-events-none before:absolute before:left-0 before:top-0 before:z-10 before:h-full before:w-[min(var(--scroll-area-gradient-width,0px),var(--scroll-area-overflow-x-start))] before:content-[''] before:[--scroll-area-overflow-x-start:inherit] before:[background:linear-gradient(to_right,var(--scroll-area-gradient-left-color,var(--scroll-area-gradient-color,transparent)),transparent)] after:pointer-events-none after:absolute after:right-0 after:top-0 after:z-10 after:h-full after:w-[min(var(--scroll-area-gradient-width,0px),var(--scroll-area-overflow-x-end))] after:content-[' ely M3.3 logic, because it needs the resolved shift + policy rules.</p><div class="text-sm font-semibold text-primary mt-5 mb-2">Step 8 — Which config applies</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">At ingestion time: almost none — only the device's timezone_mode (to normalize timestamps) and the user map (to attach an employee). Self-punches additionally consult the resolver for geofence/policy checks. Everything else waits for M3.3: the engine will call the same resolver per employee+date and compare planned instants to actual punches.</p><div class="text-sm font-semibold text-primary mt-5 mb-2">Step 9 — What the future engine does with it</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">For Priya on 2026-11-20: resolver → GEN 09:00–18:00, grace 5m; raw store → in 09:02, out 18:01 → engine writes one attendance_days row: present, worked 8h59m, no late. For Arjun: NGT 20:00–05:00+1d → the 05:10 OUT pairs back to the night shift → present, worked 9h05m. Every number traces to an immutable punch and a versioned config row — audit-ready by construction.</p></div><div class="mt-10"><div class="text-lg font-semibold text-primary mb-3">3. Impact on existing M3.1 configuration</div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div data-slot="table-chrome" class="bg-bg-elevated border-border-secondary light:bg-clip-padding @container relative w-full rounded-[12px] border p-1.5 overflow-hidden"><div role="presentation" data-slot="table-container" class="relative overflow-hidden" data-has-overflow-x="" data-overflow-x-end="" style="position: relative; --scroll-area-corner-height: 0px; --scroll-area-corner-width: 0px;"><div data-id="base-ui-_r_10_-viewport" tabindex="0" class="focus-visible:outline-bg-accent-primary size-full rounded-[inherit] outline-none focus-visible:outline focus-visible:outline-2 motion-safe:transition-[color,box-shadow] overscr  text-xs align-top">Vendor-native SDKs (ZKTeco/eSSL/Suprema)</td><td class="@sm:px-4 whitespace-nowrap px-2 [&amp;:has([role=checkbox])]:pr-0 [&amp;>[role=checkbox]]:translate-y-[2px] group-[[data-disable-highlight]]/row:group-hover/row:text-text-secondary group-hover/row:text-text-primary py-3 text-xs align-top">Future — gateway translates to push contract</td></tr><tr class="text-13 group/row"><td class="@sm:px-4 whitespace-nowrap px-2 [&amp;:has([role=checkbox])]:pr-0 [&amp;>[role=checkbox]]:translate-y-[2px] group-[[data-disable-highlight]]/row:group-hover/row:text-text-secondary group-hover/row:text-text-primary py-3 text-xs align-top">Live device health dashboard</td><td class="@sm:px-4 whitespace-nowrap px-2 [&amp;:has([role=checkbox])]:pr-0 [&amp;>[role=checkbox]]:translate-y-[2px] group-[[data-disable-highlight]]/row:group-hover/row:text-text-secondary group-hover/row:text-text-primary py-3 text-xs align-top">Future</td></tr></tbody></table></div></div></div></div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">Token lifecycle: created once per device, shown plaintext exactly once in the UI, stored as SHA-256. Rotate → new token, old hash rejected immediately. Offline sync: the device exports its log as CSV → Punch Import binds it to device_id → same dedup path, so a device that later comes online can re-push without double-recording. Retries: network failure → device resends with the same Idempotency-Key; server replays the stored batch result.</p></div><div class="mt-10"><div class="text-lg font-semibold text-primary mb-3">6. User interface — wireframes</div><p class="text-sm text-secondary leading-6 mb-3 max-w-[860px]">All screens live under the existing Attendance area. HR Admin sees all tabs; HR Executive sees the punch viewer + import (scope-filtered); employees see My Punches.</p><div class="grid grid-cols-2 gap-4 max-w-[960px]"><div><div class="text-xs font-semibold text-secondary mb-1">Device Master</div><div class="group/actions-hos rder-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-2.5"><span class="text-13 font-regular"><b>D1.</b> CSV-only import (recommended for M3.2) vs adding an .xlsx parser dependency.</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-2.5"><span class="text-13 font-regular"><b>D2.</b> pull_poll: schema seam kept, poller not built (recommended) vs build now for a specific vendor.</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-2.5"><span class="text-13 font-regular"><b>D3.</b> Self-punch geofence: enforce at ingestion via resolver (recommended) vs always record and flag for M3.3.</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-2.5"><span class="text-13 font-regular"><b>D4.</b> Device push endpoint exposed publicly vs allowlist/VPN-only deployment note.</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-2.5"><span class="text-13 font-regular"><b>D5.</b> Idempotency-Key format: free-text (recommended) vs mandated device-seq scheme.</span></div></div></div></div><p class="inline-hidden text-[12px] text-text-secondary">Sources: docs/milestones/M3-attendance-design.md (Rev 3) §2.2/E.2/E.4/E.5/E.9 and committed M3.1 code at m3-attendance@1faf7c9. Design walkthrough only — no code, migration, branch, or database change performed.</p></div></div>
