function H({ n, children }) {
  return <div className="text-lg font-semibold text-primary mt-10 mb-3">{n}. {children}</div>;
}
function P({ children }) {
  return <p className="text-sm text-secondary leading-6 mb-3 max-w-[900px]">{children}</p>;
}
function T({ headers, rows, mono }) {
  return (
    <CardContent className="mb-4">
      <Table>
        <TableHeader><TableRow>{headers.map((h, i) => <TableHead key={i}>{h}</TableHead>)}</TableRow></TableHeader>
        <TableBody>
          {rows.map((r, i) => (
            <TableRow key={i}>{r.map((c, j) => <TableCell key={j} className="text-xs align-top">{mono && j === mono ? <span className="font-mono">{c}</span> : c}</TableCell>)}</TableRow>
          ))}
        </TableBody>
      </Table>
    </CardContent>
  );
}
function WF({ title, rows }) {
  return (
    <div className="mb-5">
      <div className="text-sm font-semibold text-primary mb-2">{title}</div>
      <T headers={["#", "Actor", "What happens", "Modules", "Status today"]} rows={rows.map(r => [r[0], r[1], r[2], r[3], <St k={r[4].startsWith("LIVE") ? "LIVE" : r[4].startsWith("REVIEW") ? "REVIEW" : r[4].startsWith("PART") ? "PART" : "PLAN"}>{r[4]}</St>])} />
    </div>
  );
}

function Report() {

      <BannerCard className="mb-6">
        <Text size={13}>
          <b>The product in one paragraph.</b> One HRMS application serves every customer: each tenant gets its
          own PostgreSQL database (hard isolation), while a shared platform database tracks tenants, plans and
          which modules each tenant is entitled to. Inside a tenant, always-on core services (identity,
          organization, employee records, files, audit, notifications) support optional, sellable modules —
          attendance, leave, payroll, loans, expense, recruitment, performance, assets, exit — each in its own
          schema, enabled per tenant, and designed to degrade gracefully when a neighbour module is off.
          Status legend: <St k="LIVE" /> <St k="REVIEW" /> <St k="PART" /> <St k="PLAN" /> <St k="NODES" />
        </Text>
      </BannerCard>

      <H n="1">System architecture</H>
      <P>
        Platform layer (one per deployment) knows <em>who the tenants are and what they may use</em>; it never
        holds employee data. The API resolves tenant by verified host claim, enforces entitlements and
        permissions, and all business reads/writes go to that tenant's own database — so tenant A's data
        physically cannot appear in tenant B's queries.
      </P>
      <CardContent className="mb-4"><Diagram nodes={sysNodes} edges={sysEdges} groups={sysGroups} direction="TB" /></CardContent>

      <H n="2">Module-by-module review</H>

        uses the formal matrix (doc 14): H = hard requirement, O = optional provider with manual fallback,
        I = event/inbox integration.

      <H n="4">Architecture review</H>
      <P><b>Shared vs tenant data.</b> Platform DB: tenant registry, DB cluster registry, provisioning ops, module catalog, plans, subscriptions, entitlements, platform users, secrets refs. Everything personal/business lives per-tenant — there is no cross-tenant table and no cross-tenant query path.</P>
      <P><b>Data ownership.</b> Employee identity is owned by core.employee (always on) — every other module holds FK references, never duplicate personal data. Financial results (payroll results, FNF settlements, invoices) are immutable once finalized; corrections are new revisions (ADR-031).</P>
      <P><b>Cross-module dependencies.</b> Only core FKs allowed; optional providers consumed via .Contracts interfaces with manual-input fallbacks — so Payroll runs without Leave, and FNF runs without Assets. Results snapshot consumed inputs, so disabling a provider never rewrites history.</P>
      <P><b>Approvals.</b> One engine (core.workflow, versioned definitions) feeding one inbox (core.workitems projection) — both designed, neither built yet; today's two approval-ish flows are bespoke.</P>
      <P><b>Audit.</b> Same-transaction EF interceptor → append-only audit_entries + periodic hash-chained seals; business events also audited. Already live and used by letters/salary/attendance.</P>
      <P><b>Scalability.</b> DB-per-tenant bounds blast radius and enables per-tenant restore (logical dumps + cluster PITR); costs: connection fan-out (PgBouncer planned) and migration waves (Migrator). Report performance → pre-aggregation later.</P>
      <P><b>Retention.</b> Legal hold + erasure-by-anonymisation designed (ADR-036); punches/salary audit data immutable by triggers, not convention.</P>

      <P>Permission model: module catalogue seeds permissions → roles bundle them → users get roles + optional per-user overrides, capped by a grant ceiling; data scope (self/manager/branch/dept/company/custom) filters every employee-scoped query via IDataScopeService.</P>
